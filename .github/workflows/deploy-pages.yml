name: Deploy MGV Legal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Fix Git certificate bundle
        run: |
          sudo update-ca-certificates
          git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          git config --global http.sslVerify true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and verify web portraits
        run: |
          set -euo pipefail

          cat \
            assets/hero-parts/part0.txt \
            assets/hero-parts/part01.txt \
            assets/hero-parts/part02.txt \
            assets/hero-parts/part03.txt \
            assets/hero-parts/part04.txt \
            assets/hero-parts/part05.txt \
            assets/hero-parts/part06.txt \
            assets/hero-parts/part07.txt \
            assets/hero-parts/part08.txt \
            | base64 --decode > assets/mary-grace-city.webp

          cat \
            assets/approach-hq/part00.txt \
            assets/approach-hq/part01.txt \
            assets/approach-hq/part02.txt \
            assets/approach-hq/part03.txt \
            assets/approach-hq/part04.txt \
            assets/approach-hq/part05.txt \
            assets/approach-hq/part06.txt \
            assets/approach-hq/part07.txt \
            | base64 --decode > assets/mary-grace-approach-hq.webp

          echo "a166472495cb765f4a0145b297b6cf8a19230ec1ee2f00d56d1039e794227364  assets/mary-grace-approach-hq.webp" | sha256sum -c -
          test "$(stat -c%s assets/mary-grace-approach-hq.webp)" -eq 67110
          file assets/mary-grace-approach-hq.webp | grep -qi 'Web/P image'

          sed -i 's#assets/mary-grace-office-final.jpg#assets/mary-grace-approach-hq.webp#g' index.html
          sed -i 's#width="320" height="277"#width="1122" height="1402"#g' index.html

          rm -rf assets/hero-parts assets/approach-hq
          rm -f \
            assets/mary-grace-city.txt \
            assets/mary-grace-office.txt \
            assets/mary-grace-city-webp.b64 \
            assets/.image-build-note \
            assets/mary-grace-office-final.jpg \
            assets/mary-grace-office.jpg \
            assets/mary-grace-office.webp \
            assets/mary-grace-office-v2.jpg \
            assets/mary-grace-office-600.b64 \
            assets/office-tiny.b64

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
