name: Deploy MGV Legal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Fix Git certificate bundle
        run: |
          sudo update-ca-certificates
          git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          git config --global http.sslVerify true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare hero portrait
        run: |
          cat \
            assets/hero-parts/part0.txt \
            assets/hero-parts/part01.txt \
            assets/hero-parts/part02.txt \
            assets/hero-parts/part03.txt \
            assets/hero-parts/part04.txt \
            assets/hero-parts/part05.txt \
            assets/hero-parts/part06.txt \
            assets/hero-parts/part07.txt \
            assets/hero-parts/part08.txt \
            | base64 --decode > assets/mary-grace-city.webp
          rm -rf assets/hero-parts
          rm -f assets/mary-grace-city.txt assets/mary-grace-office.txt assets/mary-grace-city-webp.b64 assets/.image-build-note

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
